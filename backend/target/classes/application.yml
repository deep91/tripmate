# application.yml
# This file contains configuration for Spring Boot application
# including database connection, JPA, and CORS settings.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tripmate_db?useSSL=false&serverTimezone=UTC
    # Replace 'root' and 'password' with your MySQL username and password
    username: root
    password: Password@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # 'update' will auto-create/update tables; use 'validate' or 'none' in production
    show-sql: true      # Show SQL queries in the console (for debugging)
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# Server port (default is 8080)
server:
  port: 8080

# CORS configuration (for development, allow all origins)
# For production, restrict origins as needed
# You can also configure CORS in a @Configuration class 